<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Task Board</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{--bg:#f4f1ea;--col:#e8e3d8;--ink:#2b2b2b;--mut:#777}
@media (prefers-color-scheme:dark){:root{--bg:#1d1d1f;--col:#2a2a2d;--ink:#eee;--mut:#999}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
header{padding:14px 16px 6px}
h1{margin:0 0 10px;font-size:20px}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;padding:10px 12px;font-size:16px;border:1px solid #bbb;border-radius:8px;background:#fff;color:#222}
button{font:inherit;cursor:pointer}
.add button{padding:10px 16px;border:0;border-radius:8px;background:#2f6fed;color:#fff;font-weight:600}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:10px 16px 24px}
@media (max-width:760px){.board{grid-template-columns:1fr}}
.col{background:var(--col);border-radius:12px;padding:10px;min-height:120px}
.col h2{margin:2px 4px 10px;font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:flex;justify-content:space-between}
.col.over{outline:2px dashed #2f6fed}
.note{background:#ffe76a;color:#2b2b2b;border-radius:4px;padding:10px 10px 6px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,.25);cursor:grab}
.note.c1{background:#ffe76a}.note.c2{background:#ff9ebb}
.txt{white-space:pre-wrap;word-break:break-word;font-size:15px;outline:none;min-height:20px}
.bar{display:flex;gap:4px;margin-top:6px;justify-content:space-between}
.bar button{border:0;background:rgba(0,0,0,.1);border-radius:6px;padding:5px 11px;color:#222;font-size:15px}
.bar .mid{display:flex;gap:4px}
#status{font-size:12px;color:var(--mut);padding:0 16px}
</style>
</head>
<body>
<header>
  <h1>🎮 Game Task Board</h1>
  <div class="add"><input id="inp" placeholder="New task…" maxlength="300"><button id="addBtn">Add</button></div>
</header>
<div id="status"></div>
<div class="board" id="board"></div>
<script>
// Paste your Google Apps Script Web app URL (ends in /exec) between the quotes.
const SHEET_URL = "https://script.google.com/macros/s/AKfycbzibLZCNk-dVcUNqHDYLmoTY3JyHFdNXDlEsUvIqqKE8NZy5SGadF6KiL_yvJ3roKnH/exec";

const COLS=[["todo","To be done"],["doing","In Progress"],["done","Completed"]];
let tasks=[],dragId=null,pending=0;
const $=s=>document.querySelector(s);
const setStatus=s=>$("#status").textContent=s;

function cache(){try{localStorage.setItem("tasks",JSON.stringify(tasks))}catch(e){}}

async function post(action,task){
  if(!SHEET_URL)return;
  pending++;
  try{
    await fetch(SHEET_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action,task})});
    setStatus("Synced with Google Sheets");
  }catch(e){setStatus("Couldn't reach the sheet — changes kept on this device")}
  pending--;
}

async function pull(){
  if(!SHEET_URL||pending>0)return;
  if(document.activeElement&&document.activeElement.isContentEditable)return;
  try{
    const r=await fetch(SHEET_URL);
    const data=await r.json();
    if(pending>0)return;
    tasks=data;cache();render();setStatus("Synced with Google Sheets");
  }catch(e){setStatus("Offline — showing last saved board")}
}

function upd(t,patch){Object.assign(t,patch);cache();render();post("set",t)}
function remove(t){tasks=tasks.filter(x=>x.id!==t.id);cache();render();post("delete",t)}

function addTask(){
  const v=$("#inp").value.trim();if(!v)return;
  const t={id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),text:v,status:"todo",color:1,created:Date.now()};
  tasks.push(t);cache();render();post("set",t);$("#inp").value="";
}
$("#addBtn").onclick=addTask;
$("#inp").addEventListener("keydown",e=>{if(e.key==="Enter")addTask()});

function render(){
  const b=$("#board");b.innerHTML="";
  COLS.forEach(([key,label],ci)=>{
    const items=tasks.filter(t=>t.status===key).sort((a,c)=>a.created-c.created);
    const col=document.createElement("div");col.className="col";
    col.innerHTML=`<h2><span>${label}</span><span>${items.length}</span></h2>`;
    col.ondragover=e=>{e.preventDefault();col.classList.add("over")};
    col.ondragleave=()=>col.classList.remove("over");
    col.ondrop=e=>{e.preventDefault();col.classList.remove("over");const t=tasks.find(x=>x.id===dragId);if(t&&t.status!==key)upd(t,{status:key})};
    items.forEach(t=>{
      const n=document.createElement("div");n.className="note c"+(t.color===2?2:1);n.draggable=true;
      n.ondragstart=()=>{dragId=t.id};
      const tx=document.createElement("div");tx.className="txt";tx.textContent=t.text;tx.contentEditable="true";
      tx.onblur=()=>{const v=tx.textContent.trim();if(v&&v!==t.text)upd(t,{text:v});else if(!v)tx.textContent=t.text};
      const bar=document.createElement("div");bar.className="bar";
      const ico=(c)=>`<i class="${c}"></i>`;
      const l=document.createElement("button");l.innerHTML=ico("fa-solid fa-chevron-left");l.title="Move back";l.disabled=ci===0;l.style.opacity=ci===0?.3:1;
      l.onclick=()=>upd(t,{status:COLS[ci-1][0]});
      const pr=document.createElement("button");const isP=t.color===2;
      pr.innerHTML=ico((isP?"fa-solid":"fa-regular")+" fa-star");pr.title=isP?"Remove priority":"Mark as priority";
      pr.onclick=()=>upd(t,{color:isP?1:2});
      const d=document.createElement("button");d.innerHTML=ico("fa-solid fa-trash");d.title="Delete";
      d.onclick=()=>{if(confirm("Delete this note?"))remove(t)};
      const mid=document.createElement("span");mid.className="mid";mid.append(pr,d);
      const r=document.createElement("button");r.innerHTML=ico("fa-solid fa-chevron-right");r.title="Move forward";r.disabled=ci===2;r.style.opacity=ci===2?.3:1;
      r.onclick=()=>upd(t,{status:COLS[ci+1][0]});
      bar.append(l,mid,r);n.append(tx,bar);col.append(n);
    });
    b.append(col);
  });
}

try{tasks=JSON.parse(localStorage.getItem("tasks")||"[]")}catch(e){tasks=[]}
render();
if(SHEET_URL){setStatus("Loading from Google Sheets…");pull();setInterval(pull,20000)}
else setStatus("Saved on this device only (no sheet URL set)");
</script>
</body>
</html>
